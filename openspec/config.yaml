schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Проект: эмулятор компьютера i486DX4-100 на C++ (ai386emu-cpp-edition).
  Повтор исходного проекта ai386 по уже существующим спецификациям.

  Функциональность:
  - Экран — VGA с поддержкой всех текстовых и графических режимов
  - Звуковая карта — SoundBlaster16
  - HD — реальный файл, создаётся при создании ВМ; CD — один или несколько
    путей файловой системы хоста
  - Мышь, клавиатура
  - Сеть — реальная сеть компьютера (хоста)
  - Эмулятор должен загружать ОС (Linux, FreeBSD) с созданного диска
    и позволять работать в ней
  - Параметры командной строки: путь создания/использования HD, подключение
    CD, объём RAM, очередь загрузки; параметры могут задаваться в файле
    конфигурации, передаваемом при запуске

  Стек:
  - C++20, сборка — CMake (vcpkg)
  - юниттесты — GoogleTest
  - e2e тесты — прогоны эмулятора с тестовыми образами (freedos/)

  Конвенции:
  - язык общения и документации — русский
  - простой человекочитаемый код, общепринятые практики
  - тесты обязательны
  - работа в ветках по git-flow
  - если есть возмножность, то запускай субагентов параллельно, если нет — последовательно
  - цикл разработки: кодирование -> тесты -> линтеры -> исправление -> приёмка
  - настраиваемые параметры хранятся в файле конфигурации
  - разрешение на выполнение тестов и линторов не требуется, но исправление найденных проблем обязательно
  - разрешение на выполнение команд форматирования (clang-format и подобных) не требуется
  - для размышления использовать более сильные модели, для генерации кода — слабые модели

# Per-artifact rules
rules:
  proposal:
    - Писать на русском языке
    - У changes только одна цель (что и зачем), без деталей реализации
    - Включать секцию Non-goals
    - Описывать внешне наблюдаемое поведение, критерии успеха
    - Не определять и не угадывать поведение, если оно неясно — задавать вопросы

  specs:
    - Писать на русском языке
    - Delta-спека — только изменение относительно существующего поведения;
      не повторять уже описанное в базовой спеке
    - Требования должны быть проверяемыми и приводиться с примерами (Example)
    - Каждое требование формулируется как поведение системы
    - Держать спеку малой и сфокусированной на одном изменении

  design:
    - Писать на русском языке
    - Описывать только то, как достигаются требования из spec
    - Предпочитать простое человекочитаемое решение привычным практикам C++
    - Указывать новые модули/пакеты, их ответственность и границы
    - Отмечать риски и открытые вопросы
    - Дизайн обязателен только там, где нужно несколько способов решения
      или есть существенные компромиссы

  tasks:
    - Писать на русском языке
    - Разбивать работу на этапы, соответствующие модулям проекта
      (CPU, VGA, SB16, диски, ввод, сеть, конфигурация)
    - Каждая задача сопровождается тестом (GoogleTest) и/или проверкой
    - К каждой задаче указывать критерий приёмки
    - Задачи в границах одного этапа, этапы не смешивать
    - После каждой задачи указывать шаг логирования
      (время и токены)

# Per-operation guidance
operations:
  apply:
    guidance:
      - По завершении каждой задачи запускать тесты и линтеры (ctest, clang-tidy)
      - Исправлять найденные линтерами/тестами проблемы перед приёмкой
      - Логировать время и токены завершённых этапов/задач
      - Не отклоняться от задач за пределы описанного в спеке; расширение
        объёма согласовывать с пользователем
      - Кратко писать сводку по тестам на этапе приёмки
      - Не коммитить изменения без явного запроса пользователя

  archive:
    guidance:
      - Перед архивацией синхронизировать delta-спеки в базовые (главные) спеки
      - Проверять, что все задачи выполнены и исключений нет
      - Сводить результат changes — что реализовано и как проверено
      - Обновлять итоговую сводку этапа
      - Итог архивации кратко суммировать пользователю
